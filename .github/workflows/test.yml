name: test

# On pull requests, and as the first step of every deploy (deploy.yml).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # Solve for this machine only. A cross-platform lock (uv run) picks TensorFlow
      # helpers that have no Windows wheel.
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - run: uv run --no-project --python .venv python -m pytest -q
