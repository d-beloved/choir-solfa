[project]
name = "choir-solfa"
version = "0.1.0"
description = "Turn a song (link or upload) into a tonic solfa score for soprano, alto, tenor and bass."
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
dependencies = [
  "basic-pitch",
  "demucs",
  "deno",  # JavaScript runtime yt-dlp needs for YouTube; ships the binary, so users need not install Node
  "imageio-ffmpeg",  # ships an ffmpeg binary for macOS, Windows and Linux
  "fastapi",
  "librosa",
  "numpy",
  # TensorFlow on Windows and torch on Intel Macs are older builds made for NumPy 1
  "numpy<2; sys_platform == 'win32' or (sys_platform == 'darwin' and platform_machine == 'x86_64')",
  "pretty_midi",
  "python-multipart",
  "reportlab",
  "setuptools<81",  # resampy (used by basic-pitch) still imports pkg_resources
  "soundfile",
  "uvicorn",
  "yt-dlp[default]",  # includes the YouTube challenge solver (yt-dlp-ejs)
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
choir-solfa = "choir_solfa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
choir_solfa = ["web/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
